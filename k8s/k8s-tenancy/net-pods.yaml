apiVersion: v1
kind: Pod
metadata: {name: web-gpu, namespace: tenant-b, labels: {app: web}}
spec:
  nodeSelector: {gpu: "true"}
  containers:
  - {name: w, image: "busybox:1.36", command: ["sh","-c","echo hello-from-gpu-node > /tmp/index.html; httpd -f -p 8080 -h /tmp"]}
---
apiVersion: v1
kind: Pod
metadata: {name: web-cp, namespace: tenant-b, labels: {app: web}}
spec:
  nodeSelector: {kubernetes.io/hostname: k8s-cp-01}
  tolerations: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
  containers:
  - {name: w, image: "busybox:1.36", command: ["sh","-c","echo hello-from-cp-node > /tmp/index.html; httpd -f -p 8080 -h /tmp"]}
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: tenant-a}
spec:
  nodeSelector: {gpu: "true"}
  containers: [{name: c, image: "busybox:1.36", command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: client, namespace: tenant-b}
spec:
  nodeSelector: {gpu: "true"}
  containers: [{name: c, image: "busybox:1.36", command: ["sleep","3600"]}]
