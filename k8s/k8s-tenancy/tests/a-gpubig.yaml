apiVersion: v1
kind: Pod
metadata: {name: gpubig, namespace: tenant-a}
spec:
  runtimeClassName: nvidia
  nodeSelector: {gpu: "true"}
  restartPolicy: Never
  containers:
  - name: cuda
    image: nvidia/cuda:12.9.1-base-ubuntu24.04
    command: ["sleep","600"]
    resources: {limits: {nvidia.com/gpu: 2}}
