spec:
  template:
    spec:
      containers:
      - name: nvidia-device-plugin-ctr
        env:
        - {name: CONFIG_FILE, value: /config/config.yaml}
        volumeMounts:
        - {name: nvdp-config, mountPath: /config}
      volumes:
      - name: nvdp-config
        configMap: {name: nvdp-config}
