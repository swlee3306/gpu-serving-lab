apiVersion: v1
kind: ServiceAccount
metadata: {name: tenant-admin, namespace: tenant-b}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: tenant-admin, namespace: tenant-b}
rules:
- apiGroups: [""]
  resources: [pods, pods/log, pods/exec, pods/portforward, services, configmaps, secrets, persistentvolumeclaims, serviceaccounts]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets, daemonsets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [batch]
  resources: [jobs, cronjobs]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [resourcequotas, limitranges, events]
  verbs: [get, list, watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: tenant-admin, namespace: tenant-b}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: tenant-admin}
subjects: [{kind: ServiceAccount, name: tenant-admin, namespace: tenant-b}]
