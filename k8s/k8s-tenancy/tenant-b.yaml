apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
  labels: {tenant: "b", purpose: gpu-tenancy-lab, pod-security.kubernetes.io/enforce: baseline}
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: quota, namespace: tenant-b}
spec:
  hard:
    requests.nvidia.com/gpu: "1"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata: {name: defaults, namespace: tenant-b}
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 100m, memory: 128Mi}
    default: {cpu: 500m, memory: 512Mi}
